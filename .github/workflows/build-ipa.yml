- name: Build unsigned archive
  run: |
    xcodebuild \
      -project ReDyne/ReDyne.xcodeproj \
      -scheme ReDyne \
      -configuration Release \
      -sdk iphoneos \
      -archivePath ./ReDyne.xcarchive \
      IPHONEOS_DEPLOYMENT_TARGET=16.0 \
      CODE_SIGN_STYLE=Manual \
      CODE_SIGNING_ALLOWED=NO \
      CODE_SIGNING_REQUIRED=NO \
      DEVELOPMENT_TEAM='' \
      archive

- name: Package TrollStore IPA
  run: |
    rm -rf Payload ReDyne.ipa
    mkdir Payload
    cp -R ReDyne.xcarchive/Products/Applications/ReDyne.app Payload/
    ditto -c -k --sequesterRsrc Payload ReDyne.ipa
