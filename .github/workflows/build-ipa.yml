name: Build ReDyne IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcodebuild-15.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xcode tools
        run: |
          xcode-select --print-path
          xcodebuild --version

      - name: Build project
        run: |
          xcodebuild \
            -workspace ReDyne.xcworkspace \
            -scheme ReDyne \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./ReDyne.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./ReDyne.xcarchive \
            -exportPath ./ReDyne.ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReDyne-IPA
          path: ReDyne.ipa
